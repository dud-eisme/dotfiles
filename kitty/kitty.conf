# ~/.config/kitty/kitty.conf
# Converted from an Alacritty-style TOML config

# ── Shell ─────────────────────────────────────────────
shell /usr/bin/fish

# ── Font ──────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size 17.0

# ── Colors: Tokyo Night ───────────────────────────────
background #1a1b26
foreground #a9b1d6

# normal
color0  #32344a
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #ad8ee6
color6  #449dab
color7  #787c99

# bright
color8  #444b6a
color9  #ff7a93
color10 #b9f27c
color11 #ff9e64
color12 #7da6ff
color13 #bb9af7
color14 #0db9d7
color15 #acb0d0

# ── Keybindings ───────────────────────────────────────
# Shift+Return sends ESC + CR (matches the Alacritty chars binding)
map shift+enter send_text all \x1b\r
