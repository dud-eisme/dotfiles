#
# ~/.config/hypr/hyprlock.conf
# Purple glass theme
#

$accent      = rgba(203, 166, 247, 1.0)   # mauve
$accent2     = rgba(180, 190, 254, 1.0)   # lavender
$panel       = rgba(30, 20, 46, 0.35)     # translucent dark-purple glass
$panelBorder = rgba(203, 166, 247, 0.55)
$textColor   = rgba(230, 224, 250, 1.0)
$fail        = rgba(243, 139, 168, 1.0)   # soft red
$font        = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

# Background: whatever hyprpaper is currently showing, heavily blurred
# and tinted for a glassy look. Updates automatically if the wallpaper
# ever changes since it grabs a live screenshot at lock time.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.02
    contrast = 0.9
    brightness = 0.65
    vibrancy = 0.25
    vibrancy_darkness = 0.2
}

# Time
label {
    monitor =
    text = $TIME
    color = $textColor
    font_size = 78
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %B %d')"
    color = $accent2
    font_size = 18
    font_family = $font
    position = 0, 25
    halign = center
    valign = center
}

# Greeting / username
label {
    monitor =
    text = Hi, $USER
    color = $textColor
    font_size = 16
    font_family = $font
    position = 0, -60
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 280, 52
    rounding = 20
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.3
    dots_center = true
    fade_on_empty = false
    hide_input = false

    outer_color = $accent
    inner_color = rgba(255, 255, 255, 0.06)
    font_color = $textColor
    check_color = $accent2
    fail_color = $fail
    fail_text = Fuck off

    placeholder_text = <span foreground="##b4befe">Enter Password</span>
    placeholder_color = $accent2

    font_family = $font
    position = 0, -115
    halign = center
    valign = center
}
